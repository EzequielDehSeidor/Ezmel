# Netlify detecta Next.js solo y aplica su adaptador; acá se fija lo mínimo.
# Las variables de entorno (Supabase) se cargan en el panel de Netlify, no en este archivo.
# Pasos completos: docs/SUPABASE-Y-NETLIFY.md

[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 necesita Node 20.9 o más.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
